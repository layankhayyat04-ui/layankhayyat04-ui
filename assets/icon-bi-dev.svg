<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="70" cy="70" r="65" fill="#0D1117" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.6"/>

  <g filter="url(#iconGlow)">
    <rect x="35" y="85" width="10" height="20" rx="2" fill="url(#iconGrad)">
      <animate attributeName="height" values="20;35;20" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="85;70;85" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="70" width="10" height="35" rx="2" fill="url(#iconGrad)">
      <animate attributeName="height" values="35;50;35" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;55;70" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="65" y="60" width="10" height="45" rx="2" fill="url(#iconGrad)">
      <animate attributeName="height" values="45;30;45" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;75;60" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="98" y="82" font-family="Fira Code, monospace" font-size="26" font-weight="700" fill="#00D9FF" opacity="0.9">
    &lt;
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="112" y="82" font-family="Fira Code, monospace" font-size="26" font-weight="700" fill="#7C5CFF" opacity="0.9">
    /&gt;
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <line x1="30" y1="105" x2="110" y2="105" stroke="#6C7086" stroke-width="1" opacity="0.5"/>
</svg>
