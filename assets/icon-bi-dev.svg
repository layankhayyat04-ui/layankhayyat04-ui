<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#5CE1FF"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <circle cx="80" cy="80" r="72" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.35"/>
    <circle cx="80" cy="80" r="72" fill="none" stroke="url(#ringGrad)" stroke-width="2"
            stroke-dasharray="12 340" stroke-linecap="round" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="80" cy="80" r="60" fill="#0D1117"/>

  <line x1="45" y1="103" x2="115" y2="103" stroke="#2A3340" stroke-width="1.5"/>

  <g filter="url(#softGlow)">
    <rect x="52" y="83" width="12" height="20" rx="3" fill="url(#barGrad1)">
      <animate attributeName="height" values="20;34;20" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="83;69;83" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="74" y="63" width="12" height="40" rx="3" fill="url(#barGrad2)">
      <animate attributeName="height" values="40;54;40" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="63;49;63" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="48" width="12" height="55" rx="3" fill="url(#barGrad3)">
      <animate attributeName="height" values="55;40;55" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="48;63;48" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <polyline points="58,88 80,68 102,53" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/>
  </polyline>
  <circle cx="102" cy="53" r="3" fill="#FFFFFF" opacity="0.85">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
